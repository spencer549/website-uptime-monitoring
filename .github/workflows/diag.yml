name: TEMP network diagnostic

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runner egress IP
        run: |
          echo "runner egress IP: $(curl -s --max-time 15 https://api.ipify.org || echo UNKNOWN)"

      - name: TCP handshake probe
        run: |
          for ip in 34.174.188.233 198.60.193.30; do
            ok=0; fail=0
            for i in $(seq 1 12); do
              if timeout 8 bash -c "cat < /dev/null > /dev/tcp/$ip/443" 2>/dev/null; then
                ok=$((ok+1))
              else
                fail=$((fail+1))
              fi
              sleep 2
            done
            echo "RESULT $ip connected=$ok failed=$fail of 12"
          done

      - name: HTTP timing
        run: |
          for u in https://www.teleleaf.com/ https://www.vahahealth.com/ https://www.diamonddesignplans.com/; do
            for i in 1 2 3; do
              echo "TIMING $u run$i $(curl -sS -o /dev/null --max-time 30 -L \
                -w 'connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} code=%{http_code}' \
                "$u" 2>&1 | tail -1)"
            done
          done
